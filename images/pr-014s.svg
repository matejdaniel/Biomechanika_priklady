<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" width="100%" height="100%">
  <defs>
    <!-- Značky šipek -->
    <marker id="arrow-black" viewBox="0 0 10 10" refX="6" refY="3" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 6 3 L 0 6 z" fill="#111"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="3" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 6 3 L 0 6 z" fill="#0066cc"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="3" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 6 3 L 0 6 z" fill="#cc0000"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="3" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 6 3 L 0 6 z" fill="#1b8a2e"/>
    </marker>
  </defs>

  <style>
    .math { font-family: 'Times New Roman', serif; font-style: italic; font-size: 20px; }
    .label { font-family: sans-serif; font-size: 14px; fill: #222; }
    .dim-line { stroke: #555; stroke-width: 1.2; stroke-dasharray: 4,4; }
  </style>

  <!-- Vodorovná referenční rovina a úhel 20° -->
  <line x1="160" y1="380" x2="380" y2="380" class="dim-line"/>
  <path d="M 280 380 A 120 120 0 0 0 272 340" fill="none" stroke="#222" stroke-width="1.5"/>
  <text x="300" y="365" class="math">20°</text>

  <!-- Nakloněná rovina (otočená o -20 stupňů) -->
  <g transform="translate(160, 380) rotate(-20)">
    <!-- Rampa -->
    <rect x="0" y="0" width="580" height="40" fill="#e0e0e0" stroke="#555" stroke-width="2"/>
    
    <!-- Kladka -->
    <circle cx="-15" cy="-5" r="16" fill="#fff" stroke="#444" stroke-width="2"/>
    <circle cx="-15" cy="-5" r="4" fill="#666"/>
    
    <!-- Kniha / Těleso -->
    <rect x="220" y="-35" width="130" height="35" rx="3" fill="#d4af37" stroke="#7a6211" stroke-width="2"/>

    <!-- Lanko na rovině -->
    <line x1="-15" y1="-21" x2="220" y2="-21" stroke="#8b5a2b" stroke-width="2.5"/>

    <!-- Vektor rychlosti v -->
    <line x1="360" y1="-45" x2="440" y2="-45" stroke="#1b8a2e" stroke-width="3.5" marker-end="url(#arrow-green)"/>
    <text x="390" y="-55" class="math" fill="#1b8a2e">v&#8407;</text>

    <!-- Tření Ft (podél podložky nahoru) -->
    <line x1="285" y1="0" x2="375" y2="0" stroke="#cc0000" stroke-width="3" marker-end="url(#arrow-red)"/>
    <text x="385" y="-5" class="math" fill="#cc0000">F<tspan font-size="14px" dy="5">t</tspan></text>

    <!-- Tahová síla T na knize (směrem ke kladce) -->
    <line x1="285" y1="-17" x2="195" y2="-17" stroke="#cc0000" stroke-width="3" marker-end="url(#arrow-red)"/>
    <text x="180" y="-23" class="math" fill="#cc0000">T</text>

    <!-- Normálová síla FN (kolmo k podložce, osa Y je vynechána) -->
    <line x1="285" y1="-17" x2="285" y2="-120" stroke="#0066cc" stroke-width="3" marker-end="url(#arrow-blue)"/>
    <text x="295" y="-105" class="math" fill="#0066cc">F<tspan font-size="14px" dy="5">N</tspan></text>
  </g>

  <!-- Svislá část lanka s šálkem -->
  <!-- Pozice kladky v globálních souřadnicích: x ≈ 144, y ≈ 385 -->
  <line x1="145" y1="380" x2="145" y2="500" stroke="#8b5a2b" stroke-width="2.5"/>
  
  <!-- Šálek -->
  <g transform="translate(125, 500)">
    <path d="M 20 0 C 10 -15, 30 -15, 20 0" fill="none" stroke="#666" stroke-width="2"/>
    <rect x="0" y="0" width="40" height="45" rx="3" fill="#b0bec5" stroke="#37474f" stroke-width="1.5"/>
    <path d="M 40 10 C 52 10, 52 35, 40 35" fill="none" stroke="#37474f" stroke-width="2"/>
    
    <!-- Tah / Tíha šálku -->
    <line x1="20" y1="45" x2="20" y2="105" stroke="#111" stroke-width="3" marker-end="url(#arrow-black)"/>
    <text x="30" y="90" class="math">G<tspan font-size="14px" dy="5">šálek</tspan> = T</text>
  </g>

  <!-- Globální rozklad tíhové síly FG z těžiště knihy -->
  <!-- Těžiště knihy leží přibližně na [422, 273] -->
  <g transform="translate(422, 273)">
    <!-- Skutečná tíhová síla FG (svisle dolů) -->
    <line x1="0" y1="0" x2="0" y2="160" stroke="#111" stroke-width="3" marker-end="url(#arrow-black)"/>
    <text x="10" y="155" class="math">F<tspan font-size="14px" dy="5">G</tspan></text>

    <!-- Složka kolmá k rovině Fn: délka 160*cos(20°) ≈ 150 pod úhlem 70° od horizontály -->
    <line x1="0" y1="0" x2="51.3" y2="141.0" stroke="#111" stroke-width="2.5" marker-end="url(#arrow-black)"/>
    <text x="60" y="135" class="math">F<tspan font-size="14px" dy="5">n</tspan></text>

    <!-- Složka rovnoběžná s rovinou F||: délka 160*sin(20°) ≈ 54.7 -->
    <line x1="0" y1="0" x2="-51.3" y2="19.0" stroke="#111" stroke-width="2.5" marker-end="url(#arrow-black)"/>
    <text x="-80" y="25" class="math">F<tspan font-size="14px" dy="5">∥</tspan></text>

    <!-- Pomocný rovnoběžník sil -->
    <line x1="51.3" y1="141.0" x2="0" y2="160" class="dim-line"/>
    <line x1="-51.3" y1="19.0" x2="0" y2="160" class="dim-line"/>

    <!-- Úhel alfa = 20° mezi FG a Fn -->
    <path d="M 0 60 A 60 60 0 0 0 19 56" fill="none" stroke="#222" stroke-width="1.2"/>
    <text x="8" y="80" class="math" font-size="16px">20°</text>
  </g>
</svg>
