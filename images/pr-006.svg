<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 10 5 L 0 8 z" fill="black"/>
    </marker>
  </defs>

  <style>
    .vec { 
      stroke: black; 
      stroke-width: 3.5; 
      stroke-linecap: round; 
      marker-end: url(#arrow); 
    }
    .lbl { 
      font-family: serif; 
      font-weight: bold; 
      font-size: 15px; 
    }
    .lbl-center { 
      font-family: serif; 
      font-weight: bold; 
      font-size: 15px; 
      text-anchor: middle; 
    }
    .pl { 
      font-family: serif; 
      font-size: 22px; 
      font-weight: bold; 
      text-anchor: middle; 
    }
    .let { 
      font-family: sans-serif; 
      font-size: 24px; 
    }
  </style>

  <!-- Řádek A -->
  <path class="vec" d="M 40 95 L 90 45" />
  <text class="lbl" x="20" y="45">10 N</text>

  <text class="pl" x="145" y="70">+</text>

  <path class="vec" d="M 260 95 L 210 45" />
  <text class="lbl" x="235" y="45">10 N</text>

  <text class="let" x="320" y="75">A</text>

  <!-- Řádek B -->
  <path class="vec" d="M 40 195 L 90 145" />
  <text class="lbl" x="20" y="145">10 N</text>

  <text class="pl" x="145" y="170">+</text>

  <path class="vec" d="M 265 160 L 195 160" />
  <text class="lbl-center" x="230" y="150">10 N</text>

  <text class="let" x="320" y="175">B</text>

  <!-- Řádek C -->
  <path class="vec" d="M 40 295 L 90 245" />
  <text class="lbl" x="20" y="245">10 N</text>

  <text class="pl" x="145" y="270">+</text>

  <path class="vec" d="M 195 260 L 230 260" />
  <text class="lbl-center" x="212" y="250">5 N</text>

  <text class="let" x="320" y="275">C</text>

  <!-- Řádek D -->
  <path class="vec" d="M 40 395 L 90 345" />
  <text class="lbl" x="20" y="345">10 N</text>

  <text class="pl" x="145" y="370">+</text>

  <path class="vec" d="M 230 360 L 195 360" />
  <text class="lbl-center" x="212" y="350">5 N</text>

  <text class="let" x="320" y="375">D</text>
</svg>
